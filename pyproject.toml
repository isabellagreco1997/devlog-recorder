[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devlog-recorder"
version = "0.1.0"
description = "Record an AI-agent build session as a video-ready devlog: every prompt, every output, screenshots, assets and clips, in order."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Isabella Greco" }]
dependencies = ["pillow>=10"]

[project.urls]
Homepage = "https://github.com/isabellagreco1997/devlog-recorder"

[project.scripts]
devlog = "devlog_recorder.cli:main"

[tool.setuptools.packages.find]
include = ["devlog_recorder*"]
